<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seminar Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ----------------------------------------------------
       Design Tokens & Reset (Emoji Free, Enterprise Style)
       ---------------------------------------------------- */
    :root {
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --accent-subtle: rgba(99, 102, 241, 0.12);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      
      --bg-presentation: #020617;
      --bg-slide: #0b0f19;
      --bg-surface: #111827;
      --bg-surface-elevated: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-subtle: #1e293b;
      --border-strong: #334155;
      --shadow-slide: 0 25px 50px -12px rgba(0, 0, 0, 0.7);

      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      --color-info: #0ea5e9;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
    }

    [data-theme="light"] {
      --bg-presentation: #f1f5f9;
      --bg-slide: #ffffff;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --shadow-slide: 0 25px 50px -12px rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: var(--bg-presentation);
      color: var(--text-primary);
      font-family: var(--font-sans);
    }
    ::selection {
      background: rgba(99, 102, 241, 0.25);
      color: var(--text-primary);
    }

    /* ----------------------------------------------------
       MODE 1: SLIDE PRESENTATION VIEW
       ---------------------------------------------------- */
    body.mode-slide {
      overflow: hidden;
      user-select: none;
    }

    body.mode-slide #docs-view-container { display: none !important; }
    body.mode-slide #stage-container { display: flex; }

    #stage-container {
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #slide-viewport {
      width: 1920px;
      height: 1080px;
      background-color: var(--bg-slide);
      box-shadow: var(--shadow-slide);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      transform-origin: center center;
      transition: background-color 0.2s ease;
    }

    .slide {
      width: 100%; height: 100%;
      padding: 60px 80px 40px 80px;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0; left: 0;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transform: scale(0.85) translate3d(60px, 0, 0);
      filter: blur(16px);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), 
                  filter 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity, filter;
      z-index: 1;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      transform: scale(1) translate3d(0, 0, 0);
      filter: blur(0px);
      z-index: 10;
    }

    .slide.prev {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transform: scale(0.85) translate3d(-60px, 0, 0);
      filter: blur(16px);
      z-index: 1;
    }

    .slide.next {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transform: scale(0.85) translate3d(60px, 0, 0);
      filter: blur(16px);
      z-index: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .slide {
        transition: opacity 0.15s ease !important;
        transform: none !important;
        filter: none !important;
      }
    }

    /* Security Classification Badge (Header Top Center) */
    .slide-classification {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 4px 18px;
      border-radius: 4px;
      z-index: 100;
      pointer-events: none;
      font-family: var(--font-mono);
      display: inline-block;
      line-height: 1;
    }
    .classification-confidential {
      background: rgba(239, 68, 68, 0.18);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.5);
    }
    .classification-internal {
      background: rgba(245, 158, 11, 0.18);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.5);
    }
    .classification-public {
      background: rgba(16, 185, 129, 0.18);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.5);
    }
    .classification-restricted {
      background: rgba(99, 102, 241, 0.18);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.5);
    }

    /* Slide Header with Distinct Divider */
    .slide-header {
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-shrink: 0;
    }
    .slide-category {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .slide-title {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    /* Slide Footer */
    .slide-footer {
      height: 36px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-subtle);
      padding-top: 8px;
      flex-shrink: 0;
      font-weight: 500;
    }
    [data-theme="light"] .slide-footer {
      color: #334155;
      border-top-color: #cbd5e1;
    }

    /* ----------------------------------------------------
       Slide Layout Archetypes (Split vs Stacked)
       ---------------------------------------------------- */
    /* Cover */
    .slide-cover {
      justify-content: center;
      align-items: flex-start;
      padding: 90px 120px;
      background: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
    }
    .cover-badge {
      display: inline-block;
      padding: 8px 18px;
      background: var(--accent-subtle);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: var(--accent-primary);
      border-radius: 4px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 22px;
    }
    .cover-title {
      font-size: 68px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 22px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: 1500px;
    }
    .cover-subtitle {
      font-size: 26px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 48px;
      max-width: 1350px;
      line-height: 1.45;
    }
    .cover-meta {
      display: flex;
      gap: 40px;
      font-size: 20px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
      padding-top: 24px;
      width: 100%;
    }
    .cover-meta strong { color: var(--text-primary); }

    /* Agenda */
    .agenda-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-top: 12px;
    }
    .agenda-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 28px 32px;
      display: flex;
      gap: 22px;
      align-items: flex-start;
    }
    .agenda-num {
      width: 48px; height: 48px;
      background: var(--accent-gradient);
      color: white;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800;
      flex-shrink: 0;
    }
    .agenda-content h3 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .agenda-content p { font-size: 19px; color: var(--text-secondary); line-height: 1.5; }

    /* Layout 1: Split (Left 34% Bullets, Right 66% Huge Visual) */
    .split-layout {
      display: grid;
      grid-template-columns: 0.72fr 1.48fr;
      gap: 36px;
      height: 100%;
      min-height: 0;
    }
    .split-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }
    .split-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .split-bullets li {
      font-size: 25px;
      line-height: 1.5;
      color: var(--text-primary);
      position: relative;
      padding-left: 32px;
    }
    .split-bullets li::before {
      content: "";
      position: absolute;
      left: 6px; top: 13px;
      width: 10px; height: 10px;
      background: var(--accent-primary);
      border-radius: 50%;
    }
    .split-bullets li strong { color: var(--accent-primary); }
    .split-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      min-height: 740px;
      position: relative;
    }
    .split-right .slide-canvas-card {
      min-height: 740px;
    }

    /* Layout 2: Stacked (Top Compact Bullets, Bottom Maximum Wide Visual) */
    .stacked-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      gap: 16px;
    }
    .stacked-top {
      flex-shrink: 0;
    }
    .stacked-bullets {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 10px 32px;
    }
    .stacked-bullets li {
      font-size: 23px;
      line-height: 1.4;
      color: var(--text-primary);
      position: relative;
      padding-left: 28px;
    }
    .stacked-bullets li::before {
      content: "";
      position: absolute;
      left: 6px; top: 11px;
      width: 9px; height: 9px;
      background: var(--accent-primary);
      border-radius: 50%;
    }
    .stacked-bullets li strong { color: var(--accent-primary); }
    .stacked-bottom {
      flex: 1;
      height: 100%;
      min-height: 660px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .stacked-bottom .slide-canvas-card {
      min-height: 660px;
    }

    /* Canvas Card (Enlarged High-Def Architecture View) */
    .slide-canvas-card {
      width: 100%; height: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .slide-canvas-toolbar {
      padding: 10px 18px;
      background: var(--bg-surface-elevated);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .slide-canvas-btn {
      padding: 6px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.15s ease;
    }
    .slide-canvas-btn:hover {
      background: var(--accent-subtle);
      color: var(--accent-primary);
      border-color: var(--accent-primary);
    }
    .slide-canvas-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }
    .slide-canvas-body {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .mermaid-target {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .slide-canvas-body svg {
      width: 100% !important;
      max-width: 100% !important;
      height: auto !important;
      max-height: 100% !important;
      object-fit: contain !important;
      display: block;
      margin: auto;
    }

    /* Full Diagram Slide (85% Maximum Canvas) */
    .slide-full-diagram .slide-body {
      height: 100%;
    }
    .slide-full-diagram .slide-canvas-card {
      height: 100%;
    }
    .slide-full-diagram .slide-canvas-body svg {
      max-height: 100% !important;
    }

    /* Universal Mermaid Styles & Legibility Engine */
    .mermaid svg {
      font-family: var(--font-sans) !important;
      font-size: 18px !important;
    }
    [data-theme="light"] .mermaid svg {
      background: transparent !important;
    }
    [data-theme="light"] .mermaid .node text,
    [data-theme="light"] .mermaid .actor text,
    [data-theme="light"] .mermaid text.actor,
    [data-theme="light"] .mermaid .label text,
    [data-theme="light"] .mermaid .label span,
    [data-theme="light"] .mermaid .messageText,
    [data-theme="light"] .mermaid text {
      fill: #0f172a !important;
      color: #0f172a !important;
      font-weight: 600 !important;
    }
    [data-theme="light"] .mermaid .node rect,
    [data-theme="light"] .mermaid .node circle,
    [data-theme="light"] .mermaid .node ellipse,
    [data-theme="light"] .mermaid .node polygon {
      fill: #ffffff !important;
      stroke: #6366f1 !important;
      stroke-width: 1.5px !important;
    }
    [data-theme="light"] .mermaid .cluster rect {
      fill: #f1f5f9 !important;
      stroke: #94a3b8 !important;
    }
    [data-theme="light"] .mermaid .actor {
      fill: #e0e7ff !important;
      stroke: #6366f1 !important;
    }
    [data-theme="light"] .mermaid .note {
      fill: #fef3c7 !important;
      stroke: #f59e0b !important;
    }
    [data-theme="light"] .mermaid .noteText,
    [data-theme="light"] .mermaid .noteText span {
      fill: #92400e !important;
      color: #92400e !important;
    }
    [data-theme="light"] .mermaid .edgePath path {
      stroke: #6366f1 !important;
      stroke-width: 2px !important;
    }
    [data-theme="light"] .mermaid .marker {
      fill: #6366f1 !important;
      stroke: #6366f1 !important;
    }

    [data-theme="dark"] .mermaid .node text,
    [data-theme="dark"] .mermaid .actor text,
    [data-theme="dark"] .mermaid text.actor,
    [data-theme="dark"] .mermaid .label text,
    [data-theme="dark"] .mermaid .label span,
    [data-theme="dark"] .mermaid .messageText,
    [data-theme="dark"] .mermaid text {
      fill: #f8fafc !important;
      color: #f8fafc !important;
    }
    [data-theme="dark"] .mermaid .node rect,
    [data-theme="dark"] .mermaid .node circle,
    [data-theme="dark"] .mermaid .node ellipse,
    [data-theme="dark"] .mermaid .node polygon {
      fill: #1e293b !important;
      stroke: #818cf8 !important;
    }
    [data-theme="dark"] .mermaid .cluster rect {
      fill: rgba(30, 41, 59, 0.6) !important;
      stroke: #475569 !important;
    }
    [data-theme="dark"] .mermaid .actor {
      fill: #312e81 !important;
      stroke: #818cf8 !important;
    }
    [data-theme="dark"] .mermaid .edgePath path {
      stroke: #818cf8 !important;
      stroke-width: 2px !important;
    }
    [data-theme="dark"] .mermaid .marker {
      fill: #818cf8 !important;
      stroke: #818cf8 !important;
    }

    /* Bitfield Table & Comparison Table (Enlarged) */
    .bitfield-table-wrap {
      width: 100%;
      margin: 8px 0;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-surface);
    }
    .bitfield-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 18px;
      text-align: center;
    }
    .bitfield-table th {
      background: var(--bg-surface-elevated);
      padding: 14px 12px;
      border-bottom: 2px solid var(--border-strong);
      border-right: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 16px;
      font-weight: 700;
    }
    .bitfield-table td {
      padding: 16px 12px;
      border-right: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 18px;
    }
    [data-theme="dark"] .bitfield-table th,
    :root:not([data-theme="light"]) .bitfield-table th {
      border-bottom: 2px solid #4a4a4a;
      border-right: 1px solid #444;
    }
    [data-theme="dark"] .bitfield-table td,
    :root:not([data-theme="light"]) .bitfield-table td {
      border-right: 1px solid #3a3a3a;
      border-bottom: 1px solid #3a3a3a;
    }
    .bitfield-table td.highlight {
      background: var(--accent-subtle);
      color: var(--accent-primary);
      font-weight: 800;
    }

    /* Takeaway Slide */
    .slide-takeaway {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 140px;
      background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
    }
    .takeaway-quote {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      color: var(--text-primary);
    }
    .takeaway-quote strong { color: var(--accent-primary); }
    .takeaway-sub {
      font-size: 22px;
      color: var(--text-secondary);
      max-width: 1100px;
      line-height: 1.5;
    }

    /* ----------------------------------------------------
       Floating Presentation Control Bar (Auto-hiding on Bottom Hover)
       ---------------------------------------------------- */
    #bottom-control-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(calc(100% + 36px));
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 8px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), 
                  background 0.2s ease;
      color: var(--text-primary);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
    }

    #bottom-control-bar.visible,
    #bottom-control-bar:focus-within {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    [data-theme="light"] #bottom-control-bar {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #cbd5e1;
      box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.15), 0 2px 6px rgba(15, 23, 42, 0.08);
      color: #0f172a;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .ctrl-btn:hover { color: var(--text-primary); background: var(--bg-surface-elevated); }
    [data-theme="light"] .ctrl-btn {
      color: #334155;
    }
    [data-theme="light"] .ctrl-btn:hover {
      color: #0f172a;
      background: #f1f5f9;
    }

    .ctrl-counter {
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--text-primary);
      padding: 0 4px;
    }
    [data-theme="light"] .ctrl-counter {
      color: #0f172a;
    }
    
    .ctrl-badge-btn {
      background: var(--accent-subtle);
      color: var(--accent-primary);
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ctrl-badge-btn:hover {
      background: var(--accent-primary);
      color: white;
    }
    [data-theme="light"] .ctrl-badge-btn {
      background: rgba(99, 102, 241, 0.12);
      color: #4f46e5;
      border-color: rgba(99, 102, 241, 0.35);
    }
    [data-theme="light"] .ctrl-badge-btn:hover {
      background: #6366f1;
      color: white;
    }

    /* ----------------------------------------------------
       MODE 2: DOCS / HANDOUT REPORT VIEW (Technical Whitepaper)
       ---------------------------------------------------- */
    body.mode-docs {

  <script>
    let presentationData = null;
    let currentSlideIdx = 0;
    let isBlackout = false;
    let isDocsMode = false;
    let presenterChannel = null;
    const renderedMermaidSet = new Set();

    // 1. Data Loading
    try {
      const dataEl = document.getElementById('slides-data');
      presentationData = JSON.parse(dataEl.textContent);
      document.title = presentationData.title || "Seminar Presentation";
      document.getElementById('docs-nav-title').textContent = presentationData.title || "Technical Report";
    } catch (e) {
      console.error("Failed to parse slides data:", e);
    }

    const viewport = document.getElementById('slide-viewport');
    const counterEl = document.getElementById('slide-counter');
    const bottomControlBar = document.getElementById('bottom-control-bar');
    const overviewModal = document.getElementById('overview-modal');
    const overviewGrid = document.getElementById('overview-grid-container');
    const helpModal = document.getElementById('help-modal');
    const blackOverlay = document.getElementById('black-overlay');
    const docsContentArea = document.getElementById('docs-content-area');

    let controlBarTimeout = null;
    let isMouseAtBottom = false;

    function showControlBar(autoHide = true) {
      if (isDocsMode || !bottomControlBar) return;
      bottomControlBar.classList.add('visible');
      clearTimeout(controlBarTimeout);
      if (autoHide) {
        controlBarTimeout = setTimeout(() => {
          if (!isMouseAtBottom && bottomControlBar && !bottomControlBar.matches(':hover') && !bottomControlBar.matches(':focus-within')) {
            bottomControlBar.classList.remove('visible');
          }
        }, 2200);
      }
    }

    function hideControlBar() {
      if (!bottomControlBar) return;
      bottomControlBar.classList.remove('visible');
    }

    window.addEventListener('mousemove', (e) => {
      if (isDocsMode || !bottomControlBar) return;
      const threshold = window.innerHeight - 90;
      if (e.clientY >= threshold) {
        isMouseAtBottom = true;
        bottomControlBar.classList.add('visible');
      } else {
        isMouseAtBottom = false;
        if (!bottomControlBar.matches(':hover') && !bottomControlBar.matches(':focus-within')) {
          bottomControlBar.classList.remove('visible');
        }
      }
    }, { passive: true });

    if (bottomControlBar) {
      bottomControlBar.addEventListener('mouseenter', () => {
        isMouseAtBottom = true;
        bottomControlBar.classList.add('visible');
      });
      bottomControlBar.addEventListener('mouseleave', () => {
        isMouseAtBottom = false;
        bottomControlBar.classList.remove('visible');
      });
    }

    try {
      presenterChannel = new BroadcastChannel('seminar_slides_sync');
      presenterChannel.onmessage = (event) => {
        if (event.data && typeof event.data.slideIdx === 'number') {
          goToSlide(event.data.slideIdx, false);
        }
      };
    } catch(e) {}

    // 16:9 Viewport Scaler
    function scaleViewport() {
      if (isDocsMode) return;
      const padding = 20;
      const availW = window.innerWidth - padding * 2;
      const availH = window.innerHeight - padding * 2;
      const scale = Math.min(availW / 1920, availH / 1080);
      viewport.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', scaleViewport);

    // Helper: Security Classification Badge (Fix: Always prepend to slide)
    function getClassificationBadgeHtml() {
      const cls = presentationData?.classification;
      if (!cls || !cls.trim()) return '';
      const normalized = cls.trim().toUpperCase();
      let typeClass = 'classification-internal';
      if (normalized.includes('CONFIDENTIAL') || normalized.includes('SECRET')) {
        typeClass = 'classification-confidential';
      } else if (normalized.includes('PUBLIC')) {
        typeClass = 'classification-public';
      } else if (normalized.includes('RESTRICTED')) {
        typeClass = 'classification-restricted';
      }
      return `<div class="slide-classification ${typeClass}">${normalized}</div>`;
    }

    // Render Presentation Mode
    function renderSlides() {
      if (!presentationData || !presentationData.slides) return;

      overviewGrid.innerHTML = '';

      const classBadge = getClassificationBadgeHtml();

      presentationData.slides.forEach((s, idx) => {

              <div>일시: <strong>${presentationData.presenter?.date || ''}</strong></div>

        } else if (s.type === 'agenda') {

                    </div>

        } else {
          // Standard Slide: Supports 'split' (horizontal) or 'stacked' (vertical)
          const layoutMode = s.layout || (s.visual?.type === 'mermaid' && (s.visual.content.includes('graph LR') || s.visual.content.includes('sequenceDiagram')) ? 'stacked' : 'split');

          if (layoutMode === 'stacked') {

                    ${s.visual ? renderVisualBlock(s.visual, idx) : ''}
                  </div>
                </div>
              </div>

                <span>${presentationData.title}</span>
                <span>${idx + 1} / ${presentationData.slides.length}</span>

          } else {

                  <div class="slide-title">${s.heading}</div>

              </div>
              <div class="slide-body">
                <div class="split-layout">

        slideEl.innerHTML = innerContent;

        if (s.notes) {

    // Helper: Visual Block Generator (Safe Data Source Caching)
    function renderVisualBlock(visual, idSuffix) {
      if (visual.type === 'mermaid') {
        const encodedCode = encodeURIComponent(visual.content);
        return `
          <div class="slide-canvas-card">
            <div class="slide-canvas-toolbar">
              <span>아키텍처 다이어그램 (고해상도 캔버스)</span>
              <button class="slide-canvas-btn" onclick="exportSlideSVG('mermaid-target-${idSuffix}')">SVG 저장</button>
            </div>
            <div class="slide-canvas-body">
              <div class="mermaid-target" id="mermaid-target-${idSuffix}" data-mermaid-source="${encodedCode}">
                <div style="color:var(--text-muted); font-size:16px;">다이어그램 로딩 중...</div>
              </div>
            </div>
          </div>
        `;
      } else if (visual.type === 'bitfield') {
        return `
          <div class="bitfield-table-wrap">
            <table class="bitfield-table">
              <thead><tr>${visual.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
              <tbody>
                ${visual.rows.map(row => `
                  <tr>${row.map(cell => `<td class="${cell.highlight ? 'highlight' : ''}">${cell.text}</td>`).join('')}</tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (visual.type === 'html') {
        return visual.content;
      }
      return '';
    }

    // High-Resolution Mermaid Rendering Engine (Immune to theme toggle / DOM teardown)
    async function renderMermaidInElement(container, forceRerender = false) {
      if (typeof mermaid === 'undefined') return;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        theme: isDark ? 'dark' : 'neutral',
        themeVariables: {
          primaryColor: '#6366f1',
          primaryTextColor: isDark ? '#f8fafc' : '#0f172a',
          primaryBorderColor: '#6366f1',
          lineColor: isDark ? '#818cf8' : '#6366f1',
          fontFamily: 'Inter, sans-serif',
          fontSize: '22px'
        }
      });

      const targets = container.querySelectorAll('.mermaid-target');
      for (let i = 0; i < targets.length; i++) {
        const el = targets[i];
        if (!forceRerender && el.querySelector('svg')) continue;
        const source = decodeURIComponent(el.getAttribute('data-mermaid-source') || '');
        if (!source.trim()) continue;

        const uniqueSvgId = 'mmd-svg-' + Math.random().toString(36).substring(2, 9) + '-' + i;
        try {
          const { svg } = await mermaid.render(uniqueSvgId, source);
          el.innerHTML = svg;
          const svgEl = el.querySelector('svg');
          if (svgEl) {
            try {
              const bbox = svgEl.getBBox();
              if (bbox && bbox.width > 0 && bbox.height > 0) {
                const pad = 24;
                svgEl.setAttribute('viewBox', `${Math.floor(bbox.x - pad)} ${Math.floor(bbox.y - pad)} ${Math.ceil(bbox.width + pad * 2)} ${Math.ceil(bbox.height + pad * 2)}`);
              }
            } catch(e) {}
            svgEl.removeAttribute('height');
            svgEl.removeAttribute('width');
            svgEl.style.width = '100%';
            svgEl.style.height = 'auto';
            svgEl.style.maxWidth = '100%';
            svgEl.style.maxHeight = '100%';
            svgEl.style.objectFit = 'contain';
          }
        } catch(e) {
          console.warn("Mermaid render error for target:", e);
        }
      }
    }

    // Slide Navigation with Smooth 3-State Directional Transitions
    async function goToSlide(idx, broadcast = true) {
      if (!presentationData || !presentationData.slides) return;
      if (idx < 0) idx = 0;
      if (idx >= presentationData.slides.length) idx = presentationData.slides.length - 1;

      const slides = document.querySelectorAll('.slide');
      for (let i = 0; i < slides.length; i++) {
        const s = slides[i];
        if (i === idx) {
          s.classList.remove('prev', 'next');
          s.classList.add('active');
          renderMermaidInElement(s);
        } else if (i < idx) {
          s.classList.remove('active', 'next');
          s.classList.add('prev');
        } else {
          s.classList.remove('active', 'prev');
          s.classList.add('next');
        }
      }

      document.querySelectorAll('.thumb-card').forEach((t, i) => {
        t.classList.toggle('current', i === idx);
      });

      currentSlideIdx = idx;
      counterEl.textContent = `${idx + 1} / ${presentationData.slides.length}`;

      if (broadcast && presenterChannel) {
        presenterChannel.postMessage({ slideIdx: idx });
      }
    }

    function nextSlide() { goToSlide(currentSlideIdx + 1); }
    function prevSlide() { goToSlide(currentSlideIdx - 1); }

    window.goToSlide = goToSlide;
    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;

    // Toggle Docs Mode
    async function toggleDocsMode(forceDocs = null) {
      isDocsMode = forceDocs !== null ? forceDocs : !isDocsMode;
      document.body.className = isDocsMode ? 'mode-docs' : 'mode-slide';

      if (isDocsMode) {
        renderDocsView();
        await renderMermaidInElement(docsContentArea, true);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        scaleViewport();
        goToSlide(currentSlideIdx);
      }
    }

    async function toggleTheme() {
      const html = document.documentElement;
      const nextTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nextTheme);
      renderedMermaidSet.clear();
      if (isDocsMode) {
        await renderMermaidInElement(docsContentArea, true);
      } else {
        const activeSlide = document.querySelector('.slide.active');
        if (activeSlide) await renderMermaidInElement(activeSlide, true);
      }
    }

    function closeHelp() { helpModal.classList.remove('open'); }
    function toggleBlackout() {

      blackOverlay.classList.toggle('active', isBlackout);

                updateUI(Math.min(currentIdx + 1, slides.length - 1));
              } else if (['ArrowLeft', 'PageUp'].includes(e.code)) {

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (overviewModal.classList.contains('open')) {
        if (e.key === 'Escape' || e.key === 'o' || e.key === 'O') closeOverview();
        return;
      }
      if (helpModal.classList.contains('open')) {
        if (e.key === 'Escape' || e.key === '?') closeHelp();
        return;
      }

      if (e.key === '?' || (e.key === '/' && e.shiftKey)) {
        e.preventDefault();
        toggleHelp();
        return;
      }

      if (e.key === 'd' || e.key === 'D') {
        toggleDocsMode();
        return;
      }

      if (isDocsMode) {
        if (e.key === 't' || e.key === 'T') toggleTheme();
        return;
      }

      switch (e.key) {
        case 'ArrowRight':
        case ' ':
        case 'PageDown':
        case 'l':
        case 'L':
          nextSlide();
          break;
        case 'ArrowLeft':
        case 'PageUp':
        case 'h':
        case 'H':
          prevSlide();
          break;
        case 'Home':
          goToSlide(0);
          break;
        case 'End':
          goToSlide(presentationData.slides.length - 1);
          break;
        case 'f':
        case 'F':
          if (!document.fullscreenElement) document.documentElement.requestFullscreen();
          else document.exitFullscreen();
          break;
        case 'o':
        case 'O':
          toggleOverview();
          break;
        case 'b':
        case 'B':
          toggleBlackout();
          break;
        case 'p':
        case 'P':
          openPresenterMode();
          break;
        case 't':
        case 'T':
          toggleTheme();
          break;
      }
    });

    // Button Listeners
    document.getElementById('btn-next').onclick = nextSlide;
    document.getElementById('btn-prev').onclick = prevSlide;
    document.getElementById('btn-overview').onclick = toggleOverview;
    document.getElementById('btn-close-overview').onclick = closeOverview;
    // High-Fidelity Print Pre-rendering Engine
    async function prepareForPrint() {
      const allSlides = document.querySelectorAll('.slide');
      for (let i = 0; i < allSlides.length; i++) {
        await renderMermaidInElement(allSlides[i], false);
      }
      if (docsContentArea) {
        await renderMermaidInElement(docsContentArea, false);
      }
    }

    window.addEventListener('beforeprint', async () => {
      await prepareForPrint();
    });

    document.getElementById('btn-print').onclick = async () => {
      const btn = document.getElementById('btn-print');
      const originalText = btn.textContent;
      btn.textContent = '준비 중...';
      await prepareForPrint();
      btn.textContent = originalText;
      window.print();
    };
    document.getElementById('btn-toggle-docs').onclick = () => toggleDocsMode(true);
    document.getElementById('btn-back-to-slides').onclick = () => toggleDocsMode(false);
    document.getElementById('btn-docs-theme').onclick = toggleTheme;
    document.getElementById('btn-help').onclick = toggleHelp;
    document.getElementById('btn-close-help').onclick = closeHelp;
    document.getElementById('btn-fullscreen').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };

    // Wheel Navigation (Throttled & Responsive)
    let wheelLock = false;
    let wheelTimeout = null;

    window.addEventListener('wheel', (e) => {
      const isModalOpen = (overviewModal && overviewModal.classList.contains('open')) ||
                          (helpModal && helpModal.classList.contains('open'));
      if (isDocsMode || isModalOpen) return;
      if (wheelLock) return;
      if (Math.abs(e.deltaY) < 15) return;

      wheelLock = true;
      if (e.deltaY > 0) {
        nextSlide();
      } else {
        prevSlide();
      }

      clearTimeout(wheelTimeout);
      wheelTimeout = setTimeout(() => {
        wheelLock = false;
      }, 400);
    }, { passive: true });

    // Touch swipe navigation for presentation mode (Mobile / Tablet)
    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      const isModalOpen = (overviewModal && overviewModal.classList.contains('open')) ||
                          (helpModal && helpModal.classList.contains('open'));
      if (isDocsMode || isModalOpen || e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const isModalOpen = (overviewModal && overviewModal.classList.contains('open')) ||
                          (helpModal && helpModal.classList.contains('open'));
      if (isDocsMode || isModalOpen || e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx < 0) nextSlide();
        else prevSlide();
      }
    }, { passive: true });

    // SVG Export
    window.exportSlideSVG = function(targetId) {
      const targetEl = document.getElementById(targetId) || document.querySelector('.slide.active .mermaid-target') || document.querySelector('.docs-section .mermaid-target');
      const svg = targetEl ? targetEl.querySelector('svg') : (document.querySelector('.slide.active svg') || document.querySelector('.docs-section svg'));
      if (!svg) {
        alert("다운로드 가능한 SVG 다이어그램이 없습니다.");
        return;
      }
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(svg);
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `diagram-${Date.now()}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    };

    window.addEventListener('DOMContentLoaded', () => {
      renderSlides();
    });
  </script>
</body>
</html>
